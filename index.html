<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: #151f32;
            padding: 24px 20px;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #233554;
        }
        h2 { margin: 0 0 10px 0; color: #38bdf8; font-size: 20px; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 18px 0; line-height: 1.5; }
        
        .timer-badge {
            display: inline-block;
            font-size: 13px;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 15px 0;
        }

        .smart-btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .final-btn {
            display: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: #10b981;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }

        .ad-box {
            margin: 15px 0;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #334155;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Play Video Stream</h2>
        <p id="instruction-text">વિડીયો અનલોક કરવા માટે નીચેના બટન પર ક્લિક કરો:</p>

        <div class="ad-box">
            <small style="color: #64748b;">Advertisement</small>
        </div>

        <!-- સ્માર્ટલિંક બટન -->
        <a id="smart-link-btn" href="https://www.profitableratecpmnetwork.com/gsvzik9m?key=2167f73f7001d541144988b0d01bc331" target="_blank" class="smart-btn">
            ⚡ Click Here to Fast Unlock
        </a>

        <!-- નાનું ટાઈમર (શરૂઆતમાં છુપાયેલું રહેશે) -->
        <div id="countdown" class="timer-badge" style="display: none;">⏳ વિડીયો તૈયાર થઈ રહ્યો છે: 15s</div>

        <!-- આખરી Terabox બટન -->
        <a id="final-btn" href="#" class="final-btn">
            ▶️ Open Video in Terabox
        </a>

        <div class="ad-box">
            <small style="color: #64748b;">Advertisement</small>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teraboxUrl = urlParams.get('url');

        let timeLeft = 15;
        let timerStarted = false;
        const countdownEl = document.getElementById('countdown');
        const finalBtn = document.getElementById('final-btn');
        const smartBtn = document.getElementById('smart-link-btn');
        const instructionText = document.getElementById('instruction-text');

        // યુઝર સ્માર્ટલિંક બટન પર ક્લિક કરે ત્યારે જ ટાઈમર શરૂ થશે
        smartBtn.addEventListener('click', () => {
            if (timerStarted) return;
            timerStarted = true;

            smartBtn.style.display = 'none'; // એડ પર ક્લિક કર્યા પછી સ્માર્ટ બટન ગાયબ થશે
            countdownEl.style.display = 'inline-block';
            instructionText.innerText = "વેરિફિકેશન ચાલુ છે, થોડી સેકન્ડ રાહ જુઓ...";

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = `⏳ વિડીયો તૈયાર થઈ રહ્યો છે: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';

                    if (teraboxUrl) {
                        const targetLink = decodeURIComponent(teraboxUrl);
                        finalBtn.href = targetLink;
                        finalBtn.style.display = 'block';
                        instructionText.innerText = "તમારો વિડીયો તૈયાર છે! નીચે ક્લિક કરો અથવા ૫ સેકન્ડ રાહ જુઓ.";

                        // 5 સેકન્ડ પછી આપોઆપ રીડાયરેક્ટ
                        setTimeout(() => {
                            window.location.href = targetLink;
                        }, 5000);
                    } else {
                        countdownEl.style.display = 'inline-block';
                        countdownEl.innerText = "❌ માન્ય વિડીયો લિંક મળી નથી!";
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
