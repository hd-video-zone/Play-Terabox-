<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video Online</title>

    <!-- અહીં તમારી Adsterra / Monetag ની Popunder અથવા Header સ્ક્રિપ્ટ મુકો -->
    <!-- EXAMPLE: <script type='text/javascript' src='//your-ad-script.js'></script> -->

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 22px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; }
        .timer-box {
            font-size: 40px;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 20px;
            border: 2px dashed #f43f5e;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 12px;
            background: rgba(244, 63, 94, 0.1);
        }
        .btn {
            display: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover { background: #16a34a; }
        .ad-box {
            margin: 20px 0;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Play Video Stream</h2>
        <p>કૃપા કરીને વિડીયો લિંક લોડ થાય ત્યાં સુધી થોડી સેકન્ડ રાહ જુઓ...</p>

        <!-- જાહેરાત માટેનું બેનર ૧ -->
        <div class="ad-box">
            <!-- અહીં તમારી Banner Ad નો કોડ મુકવો -->
            <small style="color: #64748b;">Advertisement</small>
        </div>

        <div id="countdown" class="timer-box">15s</div>
        <div id="status-text" style="color: #cbd5e1; margin-bottom: 15px;">તમારો વિડીયો તૈયાર થઈ રહ્યો છે...</div>

        <a id="action-btn" href="#" class="btn">▶️ Go to Video</a>

        <!-- જાહેરાત માટેનું બેનર ૨ -->
        <div class="ad-box">
            <!-- અહીં તમારી Smartlink અથવા બીજી Ad નો કોડ મુકવો -->
            <small style="color: #64748b;">Advertisement</small>
        </div>
    </div>

    <script>
        // URL માંથી લિંક મેળવવા માટે
        const urlParams = new URLSearchParams(window.location.search);
        const teraboxUrl = urlParams.get('url');

        let timeLeft = 15;
        const countdownEl = document.getElementById('countdown');
        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.innerText = timeLeft + "s";

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.style.display = "none";
                
                if (teraboxUrl) {
                    const finalTarget = decodeURIComponent(teraboxUrl);
                    actionBtn.href = finalTarget;
                    actionBtn.style.display = "block";
                    statusText.innerHTML = "વિડીયો તૈયાર છે! <b>૫ સેકન્ડમાં ઓટો-ઓપન થશે...</b>";

                    // 5 સેકન્ડ પછી ઓટોમેટિક રીડાયરેક્ટ
                    setTimeout(() => {
                        window.location.href = finalTarget;
                    }, 5000);
                } else {
                    statusText.innerText = "❌ કોઈ માન્ય વિડીયો લિંક મળી નથી!";
                }
            }
        }, 1000);
    </script>
</body>
</html>
