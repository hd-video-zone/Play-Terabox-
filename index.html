<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Video - Fast Streaming</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .timer-box {
            font-size: 48px;
            font-weight: 800;
            color: #f59e0b;
            margin: 15px 0 25px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-disabled {
            background-color: #334155;
            color: #64748b;
            pointer-events: none;
        }
        .btn-active {
            background-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
        .btn-active:active {
            transform: scale(0.98);
        }
        .badge {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body onclick="triggerAdMavenPop()">

    <div class="card">
        <span class="badge">Terabox Fast Streamer</span>
        <h2>🎬 Your Video is Processing</h2>
        <p>કૃપા કરીને ટાઈમર પૂરું થાય ત્યાં સુધી રાહ જુઓ. ડાઉનલોડ લિંક નીચે દેખાશે.</p>

        <div class="timer-box" id="timer">15</div>

        <button id="actionBtn" class="btn btn-disabled" onclick="handleFinalRedirect(event)">કૃપા કરીને રાહ જુઓ...</button>
    </div>

    <script>
        // Ad-Maven SmartLink
        const ADMAVEN_SMARTLINK = "https://onepyrincehyarey.org?6CH0e=1720010";
        
        // URL માંથી Terabox લિંક મેળવવી
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        let rawTerabox = targetUrl ? decodeURIComponent(targetUrl) : "https://terabox.com";

        // ૧. પેજ પર ગમે ત્યાં પહેલી ક્લિક થાય ત્યારે Ad-Maven Popunder નવી ટેબમાં ખૂલશે
        let adMavenTriggered = false;
        function triggerAdMavenPop() {
            if (!adMavenTriggered) {
                adMavenTriggered = true;
                window.open(ADMAVEN_SMARTLINK, '_blank');
            }
        }

        let countdown = 15;
        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');

        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerElement.innerText = countdown;
            } else {
                clearInterval(interval);
                timerElement.innerText = "Ready! 🎉";
                actionBtn.innerText = "▶️ Open in TeraBox App";
                actionBtn.classList.remove('btn-disabled');
                actionBtn.classList.add('btn-active');
            }
        }, 1000);

        // ૨. ૧૫ સેકન્ડ પૂરી થઈને બટન દબાવતાં ફરી Ad-Maven ખૂલશે અને એપ ઓપન થશે
        function handleFinalRedirect(e) {
            if (e) e.stopPropagation();

            if (countdown <= 0) {
                // નવી ટેબમાં Ad-Maven SmartLink ખૂલશે
                window.open(ADMAVEN_SMARTLINK, '_blank');

                // સીધી TeraBox App ઓપન કરવા માટે Deep Link
                const cleanUrl = rawTerabox.replace(/^https?:\/\//, '');

                // પદ્ધતિ A: ડાયરેક્ટ Terabox App Scheme
                window.location.href = `terabox://${cleanUrl}`;

                // પદ્ધતિ B: Android Intent (એપ શોધશે)
                setTimeout(() => {
                    window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.dubox.drive;S.browser_fallback_url=${encodeURIComponent(rawTerabox)};end`;
                }, 400);

                // પદ્ધતિ C: જો એપ ન હોય તો બ્રાઉઝર લિંક
                setTimeout(() => {
                    window.location.href = rawTerabox;
                }, 1200);
            }
        }
    </script>
</body>
</html>
