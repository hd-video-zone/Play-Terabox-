<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Video - Fast Streaming</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .timer-box {
            font-size: 48px;
            font-weight: 800;
            color: #f59e0b;
            margin: 15px 0 25px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-disabled {
            background-color: #334155;
            color: #64748b;
            pointer-events: none;
        }
        .btn-active {
            background-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
        .btn-active:active {
            transform: scale(0.98);
        }
        .badge {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body onclick="triggerAdOnce()">

    <div class="card">
        <span class="badge">Terabox Fast Streamer</span>
        <h2>🎬 Your Video is Processing</h2>
        <p>કૃપા કરીને ટાઈમર પૂરું થાય ત્યાં સુધી રાહ જુઓ. ડાઉનલોડ લિંક નીચે દેખાશે.</p>

        <div class="timer-box" id="timer">15</div>

        <button id="actionBtn" class="btn btn-disabled" onclick="handleFinalRedirect()">કૃપા કરીને રાહ જુઓ...</button>
    </div>

    <script>
        const SMARTLINK_URL = "https://onepyrincehyarey.org?6CH0e=1720010";
        
        // URL માંથી Terabox લિંક ખેંચવી
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        const finalTeraboxUrl = targetUrl ? decodeURIComponent(targetUrl) : "https://terabox.com";

        let adTriggered = false;
        function triggerAdOnce() {
            if (!adTriggered) {
                adTriggered = true;
                window.open(SMARTLINK_URL, '_blank');
            }
        }

        let countdown = 15;
        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');

        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerElement.innerText = countdown;
            } else {
                clearInterval(interval);
                timerElement.innerText = "Ready! 🎉";
                actionBtn.innerText = "▶️ Get Video Link";
                actionBtn.classList.remove('btn-disabled');
                actionBtn.classList.add('btn-active');
            }
        }, 1000);

        function handleFinalRedirect() {
            if (countdown <= 0) {
                // સ્માર્ટલિંક નવી ટેબમાં ઓપન થશે
                window.open(SMARTLINK_URL, '_blank');
                // અને મેઈન પેજ સીધું ટેરાબોક્સ પર જશે
                window.location.href = finalTeraboxUrl;
            }
        }
    </script>
</body>
</html>
