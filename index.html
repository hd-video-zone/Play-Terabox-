            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-watch {

    <!-- ફાસ્ટ લિંક રીડાયરેક્ટ સ્ક્રિપ્ટ -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('url');
            const fallback = "https://telegram.org";
            const finalLink = targetUrl ? targetUrl : fallback;
            document.getElementById('watchBtn').href = finalLink;
            document.getElementById('openBtn').href = finalLink;
        })();
    </script>

    <script>
        function loadAdScript(src) {
            const s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.dataset.cfasync = "false";
            document.body.appendChild(s);
        }

        // પેજ રેડી થાય કે તરત જ બેકગ્રાઉન્ડમાં ત્રણેય એડ સ્ક્રિપ્ટ લોડ થશે (પેજને અટકાવ્યા વગર)
        window.addEventListener('DOMContentLoaded', () => {
            loadAdScript("https://pl31328388.profitableratecpmnetwork.com/05157e07859ebd78aea003cca5776386/invoke.js");
