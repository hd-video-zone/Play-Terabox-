<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Video - Fast Streaming</title>

    <!-- Ad-Maven verification meta tag -->
    <meta name="admaven-site-verification" content="admaven">

    <!-- Ad-Maven Popunder / Auto-Redirect Script (જો હોય તો અહીં પેસ્ટ કરવો) -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .timer-box {
            font-size: 42px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }
        .btn-disabled {
            background-color: #475569;
            color: #94a3b8;
            pointer-events: none;
        }
        .btn-active {
            background-color: #22c55e;
            color: #ffffff;
        }
        .ad-slot {
            margin: 18px 0;
            padding: 12px;
            background-color: #0f172a;
            border: 1px dashed #475569;
            border-radius: 8px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Video Link Ready</h2>
        <p>તમારો વિડીયો લોડ થઈ રહ્યો છે. કૃપા કરીને થોડી સેકન્ડ રાહ જુઓ...</p>

        <!-- Banner Ad Slot 1 -->
        <div class="ad-slot">
            <!-- Ad-Maven Banner Script 1 અહીં પેસ્ટ કરવો -->
            <span>Advertisement</span>
        </div>

        <div class="timer-box" id="timer">15</div>

        <!-- Banner Ad Slot 2 -->
        <div class="ad-slot">
            <!-- Ad-Maven Banner Script 2 અહીં પેસ્ટ કરવો -->
            <span>Advertisement</span>
        </div>

        <a id="actionBtn" class="btn btn-disabled" href="#">કૃપા કરીને રાહ જુઓ...</a>
    </div>

    <script>
        // URL માંથી Terabox લિંક મેળવવી
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        let countdown = 15;
        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');

        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerElement.innerText = countdown;
            } else {
                clearInterval(interval);
                timerElement.innerText = "Ready!";
                actionBtn.innerText = "▶️ Continue to Video";
                actionBtn.classList.remove('btn-disabled');
                actionBtn.classList.add('btn-active');

                if (targetUrl) {
                    const finalUrl = decodeURIComponent(targetUrl);
                    actionBtn.href = finalUrl;
                    // ટાઈમર પૂરું થતાં ઓટો-રીડાયરેક્ટ
                    window.location.href = finalUrl;
                } else {
                    actionBtn.innerText = "લિંક ઉપલબ્ધ નથી";
                }
            }
        }, 1000);
    </script>
</body>
</html>
