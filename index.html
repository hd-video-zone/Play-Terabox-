<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Video</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h2 { font-size: 20px; margin-bottom: 12px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .timer-box { font-size: 46px; font-weight: bold; color: #f59e0b; margin: 15px 0; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background-color: #334155;
            color: #64748b;
        }
        .btn.active {
            background-color: #22c55e;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🎬 Video Stream Ready</h2>
        <p>કૃપા કરીને ટાઈમર પૂર્ણ થવાની રાહ જુઓ...</p>
        <div class="timer-box" id="timer">15</div>
        <button id="actionBtn" class="btn" disabled>રાહ જુઓ (15s)...</button>
    </div>

    <script>
        const SMARTLINK_URL = "https://onepyrincehyarey.org?6CH0e=1720010";
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        const rawTerabox = targetUrl ? decodeURIComponent(targetUrl) : "https://terabox.com";

        // પેજ પર પહેલી ક્લિકે એડ ખૂલશે (બ્રાઉઝર ફ્રીઝ થયા વગર)
        let adClicked = false;
        document.body.addEventListener('click', function() {
            if (!adClicked) {
                adClicked = true;
                window.open(SMARTLINK_URL, '_blank');
            }
        });

        let countdown = 15;
        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');

        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerElement.innerText = countdown;
                actionBtn.innerText = `રાહ જુઓ (${countdown}s)...`;
            } else {
                clearInterval(interval);
                timerElement.innerText = "Ready! 🎉";
                actionBtn.innerText = "▶️ Open Video in TeraBox";
                actionBtn.disabled = false;
                actionBtn.classList.add('active');
            }
        }, 1000);

        actionBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (countdown <= 0) {
                // બેકગ્રાઉન્ડ એડ
                window.open(SMARTLINK_URL, '_blank');

                // સીધી એપ્લિકેશન પર રીડાયરેક્ટ
                const cleanUrl = rawTerabox.replace(/^https?:\/\//, '');
                window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.dubox.drive;S.browser_fallback_url=${encodeURIComponent(rawTerabox)};end`;

                setTimeout(() => {
                    window.location.href = rawTerabox;
                }, 1000);
            }
        });
    </script>
</body>
</html>
