<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0e1621;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .ad-container {
            width: 100%;
            max-width: 480px;
            margin: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .main-card {
            background-color: #17212b;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #242f3d;
        }
        .video-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #7f91a4;
            margin-bottom: 22px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            border: none;
            transition: 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-watch {
            background: linear-gradient(135deg, #0088cc, #006699);
            margin-bottom: 12px;
        }
        .btn-watch:hover {
            opacity: 0.9;
        }
        .btn-open {
            background: linear-gradient(135deg, #28a745, #1e7e34);
        }
        .btn-open:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- ૧. વિડીયો બોક્સની ઉપરની જાહેરાત (TOP AD) -->
    <div class="ad-container">
        <script async="async" data-cfasync="false" src="https://pl31328388.profitableratecpmnetwork.com/05157e07859ebd78aea003cca5776386/invoke.js"></script>
        <div id="container-05157e07859ebd78aea003cca5776386"></div>
    </div>

    <!-- ૨. મુખ્ય વિડીયો કન્ટેન્ટ બોક્સ -->
    <div class="main-card">
        <div class="video-icon">🎬</div>
        <h1>Exclusive Video Ready</h1>
        <p>Click below to stream or open your requested video link instantly.</p>
        
        <a id="watchBtn" href="#" class="btn btn-watch" target="_blank">▶️ WATCH NOW</a>
        <a id="openBtn" href="#" class="btn btn-open" target="_blank">⚡ FAST DOWNLOAD</a>
    </div>

    <!-- ૩. વિડીયો બોક્સની નીચેની જાહેરાત (BOTTOM AD) -->
    <div class="ad-container">
        <script async="async" data-cfasync="false" src="https://pl31328456.profitableratecpmnetwork.com/db5b58698f870a856916ae32efd01faa/invoke.js"></script>
        <div id="container-db5b58698f870a856916ae32efd01faa"></div>
    </div>

    <!-- યુઝરે બોટમાંથી મોકલેલી લિંક ઓટો-સેટ કરવાની સ્ક્રિપ્ટ -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        if (targetUrl) {
            document.getElementById('watchBtn').href = targetUrl;
            document.getElementById('openBtn').href = targetUrl;
        } else {
            document.getElementById('watchBtn').href = "https://telegram.org";
            document.getElementById('openBtn').href = "https://telegram.org";
        }
    </script>

    <!-- ૪. હાઇ-CPM સોશિયલ બાર / પોપ સ્ક્રિપ્ટ -->
    <script src="https://pl31328457.profitableratecpmnetwork.com/01/4c/cb/014ccb880bbe4db5aeb75a2f85d0e618.js"></script>
</body>
</html>
