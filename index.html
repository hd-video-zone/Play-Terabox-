    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0e1621;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;

        }
        .ad-container {
            width: 100%;
            max-width: 480px;
            margin: 10px 0;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            overflow: hidden;
        }
        .main-card {
            background-color: #17212b;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #242f3d;
        }
        .video-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .timer-box {
            background: #242f3d;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0 20px 0;
            font-size: 15px;
            color: #38bdf8;
            font-weight: bold;
        }
        #countdown {
            font-size: 20px;
            color: #f59e0b;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-watch {
            background: linear-gradient(135deg, #0088cc, #006699);
            margin-bottom: 12px;
        }
        .btn-open {
            background: linear-gradient(135deg, #28a745, #1e7e34);
        }
    </style>
</head>
<body>

    <!-- ૧. ઉપરની જાહેરાત (TOP AD) -->
    <div class="ad-container">
        <div id="container-05157e07859ebd78aea003cca5776386"></div>
    </div>

    <!-- ૨. મુખ્ય બોક્સ (૧૦ સેકન્ડ ટાઈમર સાથે) -->
    <div class="main-card">
        <div class="video-icon">🎬</div>
        <h1>Exclusive Video Ready</h1>
        
        <div class="timer-box">
            ⏳ Opening video in: <span id="countdown">10</span> seconds...
        </div>
        
        <a id="watchBtn" href="#" class="btn btn-watch" target="_blank">▶️ WATCH NOW</a>
        <a id="openBtn" href="#" class="btn btn-open" target="_blank">⚡ FAST DOWNLOAD</a>
    </div>

    <!-- ૩. નીચેની જાહેરાત (BOTTOM AD) -->
    <div class="ad-container">
        <div id="container-db5b58698f870a856916ae32efd01faa"></div>
    </div>

    <!-- ટાઈમર અને ઓટો-રીડાયરેક્ટ સ્ક્રિપ્ટ -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        const fallback = "https://telegram.org";
        const finalLink = targetUrl ? targetUrl : fallback;

        document.getElementById('watchBtn').href = finalLink;
        document.getElementById('openBtn').href = finalLink;

        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownElement.textContent = timeLeft;
            } else {
                clearInterval(timer);
                countdownElement.textContent = "0";
                // ૧૧મી સેકન્ડે ઓટોમેટિક રીડાયરેક્ટ
                window.location.href = finalLink;
            }
        }, 1000);
    </script>

    <!-- એડ સ્ક્રિપ્ટ્સ લોડર -->
    <script>
        function loadAdScript(src) {
            const s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.dataset.cfasync = "false";
            document.body.appendChild(s);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAdScript("https://pl31328388.profitableratecpmnetwork.com/05157e07859ebd78aea003cca5776386/invoke.js");
            loadAdScript("https://pl31328456.profitableratecpmnetwork.com/db5b58698f870a856916ae32efd01faa/invoke.js");
            loadAdScript("https://pl31328457.profitableratecpmnetwork.com/01/4c/cb/014ccb880bbe4db5aeb75a2f85d0e618.js");
        });
