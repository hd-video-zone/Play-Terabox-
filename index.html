<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraBox Player - High Speed Stream</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 18px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 12px 35px rgba(0,0,0,0.65);
            border: 1px solid #334155;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 6px;
            color: #f8fafc;
            font-weight: 700;
        }
        p.sub-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Real Robot Captcha Style Box */
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1.5px solid #475569;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .captcha-box:hover {
            border-color: #38bdf8;
            background: #131d33;
        }
        .captcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #64748b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            transition: all 0.2s ease;
        }
        .checkbox-checked {
            border-color: #22c55e !important;
            background: #22c55e !important;
        }
        .checkmark {
            display: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .captcha-text {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            text-align: left;
        }
        .captcha-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.7;
        }
        .captcha-right svg {
            width: 24px;
            height: 24px;
        }
        .captcha-right span {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Small Minimalist Timer */
        .timer-wrapper {
            margin: 14px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .timer-tag {
            background: #0f172a;
            color: #f59e0b;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 8px;
            border: 1px solid #f59e0b33;
            font-size: 13px;
        }

        /* Play Button */
        .play-btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background-color: #334155;
            color: #94a3b8;
        }
        .play-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.45);
            animation: pulse 1.8s infinite;
        }
        .play-btn.active:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">FAST HD STREAM</span>
        <h2>Video Link Ready</h2>
        <p class="sub-text">Complete Quick Verification to Play Video</p>

        <!-- Captcha Verification Box (Ad 2 Link) -->
        <div class="captcha-box" id="captchaBox" onclick="handleCaptchaClick()">
            <div class="captcha-left">
                <div class="checkbox" id="captchaCheck">
                    <span class="checkmark" id="checkIcon">✓</span>
                </div>
                <div class="captcha-text" id="captchaLabel">I'm not a robot (Verify)</div>
            </div>
            <div class="captcha-right">
                <svg viewBox="0 0 24 24" fill="#38bdf8">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm0-10h2v8h-2V6z"/>
                </svg>
                <span>Security</span>
            </div>
        </div>

        <!-- Small Minimalist Timer -->
        <div class="timer-wrapper">
            <span>Video Link unlocks in:</span>
            <span class="timer-tag" id="timer">15s</span>
        </div>

        <!-- Play TeraBox Link Button (Ad 1 Link) -->
        <button id="actionBtn" class="play-btn" disabled onclick="handleFinalRedirect()">
            ▶️ Play TeraBox Link
        </button>
    </div>

    <script>
        const AD_LINK_FINAL = "https://onepyrincehyarey.org?6CH0e=1720010"; // Play Button Link
        const AD_LINK_CAPTCHA = "https://onepyrincehyarey.org?8JjHw=1161684"; // Captcha Link
        
        // URL Parameter થી Terabox Link મેળવવી
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        const rawTerabox = targetUrl ? decodeURIComponent(targetUrl) : "https://terabox.com";

        // ૧. કેપ્ચા પર ક્લિક થતાં
        let isVerified = false;
        function handleCaptchaClick() {
            if (!isVerified) {
                isVerified = true;
                window.open(AD_LINK_CAPTCHA, '_blank');
                
                document.getElementById('captchaCheck').classList.add('checkbox-checked');
                document.getElementById('checkIcon').style.display = 'block';
                document.getElementById('captchaLabel').innerText = "Verified Successfully!";
                document.getElementById('captchaLabel').style.color = "#34d399";
            }
        }

        // ૨. ટાઈમર કાઉન્ટડાઉન
        let countdown = 15;
        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');

        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerElement.innerText = `${countdown}s`;
            } else {
                clearInterval(interval);
                timerElement.innerText = "Unlocked!";
                timerElement.style.color = "#10b981";
                actionBtn.innerText = "▶️ Play TeraBox Link (Click Here)";
                actionBtn.disabled = false;
                actionBtn.classList.add('active');
            }
        }, 1000);

        // ૩. Play TeraBox Link બટન ક્લિક થતાં
        function handleFinalRedirect() {
            if (countdown <= 0) {
                // નવી ટેબમાં Ad 1 ખૂલશે
                window.open(AD_LINK_FINAL, '_blank');

                // સીધી TeraBox App ઓપન કરવા માટે
                const cleanUrl = rawTerabox.replace(/^https?:\/\//, '');

                // પદ્ધતિ 1: App Scheme
                window.location.href = `terabox://${cleanUrl}`;

                // પદ્ધતિ 2: Android Intent
                setTimeout(() => {
                    window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.dubox.drive;S.browser_fallback_url=${encodeURIComponent(rawTerabox)};end`;
                }, 400);

                // પદ્ધતિ 3: Fallback બ્રાઉઝર
                setTimeout(() => {
                    window.location.href = rawTerabox;
                }, 1200);
            }
        }
    </script>
</body>
</html>
